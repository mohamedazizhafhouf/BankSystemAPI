spring.application.name=mely

# Dev: to load gitignored secrets from application-local.properties, run with --spring.profiles.active=local (or env SPRING_PROFILES_ACTIVE=local).
# spring.profiles.active=local

server.port=8090

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mely_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Configuration
spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Multipart uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2MB

# Halal stocks storage
mely.stocks.storage.base-path=${MELY_STOCKS_STORAGE_PATH:${user.home}/.mely/stocks}

# Zakat calculator (educational estimator; currency-agnostic amounts — label currency in UI)
mely.zakat.gold-nisab-grams=87.48
mely.zakat.silver-nisab-grams=612.36
mely.zakat.default-gold-price-per-gram=75
mely.zakat.default-silver-price-per-gram=1
mely.zakat.zakat-rate=0.025

# api.gold-api.com — spot prices are free (no key). Price history: x-api-key header. Set GOLD_API_KEY or MELY_GOLD_API_KEY, or use application-local.properties (see example file). Never commit real keys.
mely.goldapi.base-url=https://api.gold-api.com
mely.goldapi.api-key=756c82b4f84c92d77fe65c1f06b86f850293520c7ba4583fbe26fdffa7eab178
mely.goldapi.access-token=${GOLD_API_BEARER_TOKEN:}
mely.goldapi.max-history-days=12
mely.goldapi.request-delay-ms=150

# APILayer Currencylayer (Currency Data API) — https://docs.apilayer.com/currencylayer/docs/quickstart-guide
